<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<title>永昇驗屋水印</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="永昇水印">
<style>
:root{--c:#4a9e3c;--bg:#f4f4f2;--card:#fff;--ink:#1d1d1d;--mute:#777;--line:#e2e2df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;padding-bottom:140px}
header{background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.tpls{display:flex;gap:8px}
.tpl{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:15px;color:var(--ink)}
.tpl img{width:30px;height:30px;border-radius:6px;object-fit:cover}
.tpl small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.tpl.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
main{padding:12px;max-width:720px;margin:0 auto}
.add{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:700;background:#fff;color:var(--ink);border:1.5px solid var(--line);text-align:center;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--c);color:#fff;border-color:var(--c)}
.btn:disabled{opacity:.45}
label.btn{display:block}
input[type=file]{display:none}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.th{position:relative;flex:0 0 auto;width:64px;height:64px;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#ddd}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.on{border-color:var(--c)}
.th .x{position:absolute;top:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;width:20px;height:20px;line-height:20px;text-align:center;border-bottom-left-radius:6px}
.th .ok{position:absolute;left:2px;bottom:2px;background:var(--c);color:#fff;font-size:11px;border-radius:4px;padding:0 4px}
.prev{background:#222;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:120px}
.prev canvas{max-width:100%;max-height:62vh;display:block}
.empty{color:#aaa;padding:40px 16px;text-align:center;font-size:14px;line-height:1.7}
.warn{font-size:13px;color:#a15c00;background:#fff4e0;border-radius:8px;padding:6px 10px;margin-top:6px;display:none}
.off{display:none;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-top:6px}
.off input{flex:1}
.card{background:var(--card);border-radius:12px;padding:12px;margin-top:10px;border:1px solid var(--line)}
.f{margin-bottom:12px}
.f:last-child{margin-bottom:0}
.f .lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-bottom:4px}
.f .lab button{border:0;background:none;color:var(--c);font-size:13px;padding:2px 4px;font-family:inherit}
.f input,.f textarea{width:100%;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;background:#fff;color:var(--ink)}
.f textarea{resize:vertical;min-height:52px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#f7f7f5;border-radius:999px;padding:6px 11px;font-size:14px;color:var(--ink);font-family:inherit}
.chip.rec{border-color:color-mix(in srgb,var(--c) 45%,#fff);background:color-mix(in srgb,var(--c) 8%,#fff)}
.chip .d{color:#c33;margin-left:4px;font-weight:700}
.lockbar{display:flex;align-items:center;gap:10px;background:#fff7e6;border:1.5px solid #f2b04a;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px;line-height:1.5;color:#6b4a00}
.lockbar span{flex:1}
.lockbar button{flex:0 0 auto;border:0;background:#f29600;color:#fff;font-weight:700;border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit}
.lockbar.draft{background:#eef6ff;border-color:#9cc3ea;color:#1f4f7a}
.prev{position:relative}
.prev.locked::after{content:"🔒 已儲存";position:absolute;top:10px;right:10px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:4px 10px;border-radius:999px}
.pin{border:1px solid var(--line)!important;border-radius:999px;padding:2px 9px!important;margin-right:4px}
.pin.on{background:#f29600!important;color:#fff!important;border-color:#f29600!important}
.ft{position:sticky;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#111 35%)}
.ft button{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:var(--c);color:#fff;font-family:inherit}
.snk{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:10px;background:#222;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);transform:translateY(140%);transition:transform .25s}
.snk.show{transform:none}
.snk span{flex:1}
.snk button{border:0;background:#f29600;color:#fff;font-weight:700;border-radius:10px;padding:9px 14px;font-size:14px;font-family:inherit}
#out .it .bt .edit{background:#f29600}
.iw{position:relative}
.iw input,.iw textarea{padding-right:40px}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.08);color:#666;font-size:13px;line-height:30px;padding:0}
.ac{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:4px;box-shadow:0 6px 18px rgba(0,0,0,.12);overflow:hidden}
.ac.show{display:block}
.acr{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.acr:last-child{border-bottom:0}
.act{flex:1;padding:11px 12px;font-size:16px;color:var(--ink);cursor:pointer}
.act b{color:var(--c)}
.acx{border:0;background:none;color:#999;font-size:15px;padding:11px 14px}
.tok{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.tok:empty{display:none}
.tk{border:0;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--ink);border-radius:8px;padding:4px 6px 4px 9px;font-size:13.5px;font-family:inherit}
.tk i{font-style:normal;color:#999;margin-left:5px;font-size:11px}
.tsep{color:var(--mute);font-size:13px}
.grp{display:flex;align-items:center;gap:8px;margin-top:8px}
.gl{flex:0 0 auto;min-width:2.4em;font-size:12px;color:var(--mute);font-weight:700;text-align:right;white-space:nowrap}
.gs{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:1px 0}
.gs::-webkit-scrollbar{display:none}
.gs .chip{flex:0 0 auto;white-space:nowrap}
.chip .sp{color:#f29600;margin-right:3px;font-size:12px}
.chip.sel .sp{color:#fff}
.qbar{display:none;gap:8px;margin-top:8px}
.qbar.show{display:flex}
.qbar .btn{flex:1;padding:12px 8px;font-size:15px;text-align:center}
.qbar .btn:disabled{opacity:.6}
.gl.rel{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.gl.rel b{color:var(--c);font-size:13px}
.gl.rel small{font-size:10.5px;font-weight:500}
.morec{color:var(--c);border-style:dashed!important;font-weight:700}
.chip.other{opacity:.75}
.osep{flex:0 0 auto;align-self:center;font-size:11px;color:var(--mute);padding:0 2px 0 6px;border-left:1px solid var(--line)}
.addc{color:var(--mute);border-style:dashed!important}
.addbox{display:flex;gap:4px;flex:0 0 auto}
.addbox input{width:7em;font-size:14px;padding:5px 8px;border:1px solid var(--c);border-radius:999px;font-family:inherit}
.addbox button{border:0;background:var(--c);color:#fff;border-radius:999px;padding:0 10px}
.nav{display:flex;gap:8px;margin-top:10px}
.nav .btn{flex:1;padding:10px}
.bar{display:flex;gap:8px;margin-top:10px}
.bar .btn{flex:1}
details.card summary{font-weight:700;cursor:pointer}
.set{display:grid;grid-template-columns:1fr 1.3fr;gap:8px 10px;align-items:center;margin-top:10px;font-size:14px}
.set input,.set select{width:100%;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
.set input[type=range]{padding:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:8;color:#fff;font-weight:700}
.mask.show{display:flex}
.time{font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px}
.time input{flex:1;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
#ed{position:fixed;inset:0;background:#111;z-index:20;display:none;flex-direction:column}
#ed.show{display:flex}
#ed .top,#ed .tools{display:flex;gap:6px;padding:8px 10px;align-items:center;background:#1c1c1c}
#ed .top{justify-content:space-between;padding-top:calc(8px + env(safe-area-inset-top))}
#ed .top b{color:#fff;font-size:15px}
#ed .cv{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px}
#ed canvas{max-width:100%;max-height:100%;touch-action:none;display:block}
#ed .tools{flex-wrap:wrap;justify-content:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#ed button{border:0;border-radius:10px;padding:9px 11px;font-size:15px;background:#2c2c2c;color:#fff;font-family:inherit}
#ed button:disabled{opacity:.35}
#ed button.on{background:#fff;color:#111;font-weight:700}
#ed .pri{background:var(--c)}
#ed .col{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid #2c2c2c}
#ed .col.on{border-color:#fff}
#ed .sep{width:1px;height:26px;background:#444;margin:0 2px}
#tbar{display:none;gap:6px;padding:8px 10px;background:#1c1c1c}
#tbar.show{display:flex}
#tbar input{flex:1;font-size:17px;padding:9px 10px;border-radius:10px;border:0;font-family:inherit}
.annoB{margin-top:8px;width:100%;padding:11px}
.stripe,.step{display:none}
.tip0{display:block;font-size:12.5px;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:7px 10px;margin-top:8px;line-height:1.5}
.iosGuide{display:none;margin-top:10px;background:#fff;border:1.5px solid var(--c);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.6}
body.ios .iosGuide{display:block}
.iosGuide summary{font-weight:700;color:var(--c);cursor:pointer}
.iosGuide ol{margin:6px 0 4px;padding-left:20px}
.iosGuide small{color:var(--mute)}
.upd{display:none;background:#1e7d3c;color:#fff;text-align:center;padding:11px 12px;font-size:15px;font-weight:700;cursor:pointer}
.upd.show{display:block}
.credit{text-align:center;font-size:11px;color:var(--mute);opacity:.75;margin:0 0 8px;letter-spacing:.5px}
.ver{text-align:center;font-size:12px;color:var(--mute);margin:14px 0 4px}
#out .hd .big{background:#1fa463!important;font-size:16px;padding:11px 14px}
.look{display:none;gap:12px;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.look.show{display:flex}
.look label{flex:1;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.look b{color:var(--ink)}
.look input{width:100%;accent-color:var(--c)}
.chip.sel{background:var(--c);color:#fff;border-color:var(--c)}
#out{position:fixed;inset:0;background:#111;z-index:30;display:none;flex-direction:column;color:#fff}
#out.show{display:flex}
#out .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#1c1c1c}
#out .hd b{flex:1;font-size:15px}
#out .hd button,#out .it button{border:0;border-radius:10px;padding:9px 12px;font-size:15px;background:#2c2c2c;color:#fff;font-family:inherit}
#out .hd .pri{background:var(--c)}
#out .tip{font-size:13px;color:#ccc;padding:8px 12px;background:#1c1c1c;border-top:1px solid #333;line-height:1.6}
#out .ls{flex:1;overflow:auto;padding:10px 12px 20px}
#out .it{margin-bottom:16px}
#out .it img{width:100%;display:block;border-radius:8px;-webkit-touch-callout:default;user-select:auto}
#out .it .nm{font-size:12px;color:#aaa;margin:6px 0;word-break:break-all}
#out .it .bt{display:flex;gap:8px}
#out .it .bt button{flex:1}
</style>
<style>:root{--c:#1f5f35!important;--c2:#2f8a4e;--c3:#f29600;--bg:#f1f4f2;--card:#fff;--ink:#16241b;--mute:#6b7a70;--line:#dfe6e1}
body{font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:.2px}
header{background:linear-gradient(135deg,#17492a 0%,#1f5f35 55%,#2b7a45 100%);padding:16px 16px 0;border:0;position:relative;overflow:hidden}
header::before{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(242,150,0,.45),rgba(242,150,0,0) 70%)}
.tpls{display:block;position:relative}
.tpl{border:0!important;box-shadow:none!important;padding:0 0 14px;gap:12px;background:none;font-size:19px;letter-spacing:2px}
.tpl span{color:#fff;text-align:left}
.tpl img{width:52px;height:52px;border-radius:50%;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.tpl small{font-size:12.5px;letter-spacing:2px;color:#cfe6d6;margin-top:3px;font-weight:500}
.stripe{display:block;height:4px;margin:0 -16px;background:linear-gradient(90deg,#f29600 0 30%,rgba(242,150,0,.35) 30% 100%)}
main{padding:4px 16px 16px}
.step{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--ink);margin:22px 2px 10px;letter-spacing:1.5px}
.step b{font-size:11px;color:var(--c3);letter-spacing:1px;font-weight:700;border:1.5px solid var(--c3);border-radius:6px;padding:2px 6px}
.step b::before{content:"STEP ";}
.step::after{content:"";flex:1;height:1.5px;background:var(--line)}
.btn{border-radius:10px;border:1.5px solid var(--line);font-weight:700;letter-spacing:1.5px;color:var(--c);background:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--c);border:0;color:#fff;box-shadow:0 5px 14px rgba(31,95,53,.28)}
.add .btn{padding:16px 10px;font-size:17px}
.add label.btn:not(.pri){border-color:#b9d3c1}
.strip{padding-top:12px}
.th{border-radius:8px;width:60px;height:60px}
.th.on{border-color:var(--c3);box-shadow:0 0 0 2px rgba(242,150,0,.25)}
.th .ok{background:var(--c2)}
.prev{border-radius:12px;background:#101c14;margin-top:2px;box-shadow:0 6px 18px rgba(16,28,20,.22)}
.empty{color:#93a89a}
.annoB{border:1.5px dashed var(--c3);background:#fff7ea;color:#b56d00;border-radius:10px}
.warn{background:#fff6e5;color:#8a5600;border-radius:10px}
.off input{accent-color:var(--c)}
.card{border:0;border-radius:14px;box-shadow:0 2px 12px rgba(20,50,30,.07);padding:16px;border-top:3px solid var(--c)}
details.card{border-top:0}
.f{margin-bottom:18px}
.f .lab{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.8px}
.f .lab span:first-child::before{content:"";display:inline-block;width:8px;height:8px;background:var(--c3);border-radius:2px;margin-right:8px;vertical-align:1px}
.f .lab button{color:var(--c2);font-weight:700}
.f input,.f textarea{background:#f1f5f2;border:1.5px solid transparent;border-radius:10px;font-size:17px;color:var(--ink)}
.f input:focus,.f textarea:focus{background:#fff;border-color:var(--c);box-shadow:0 0 0 4px rgba(31,95,53,.14)}
.chips{gap:7px;margin-top:9px}
.chip{background:#fff;border:1px solid var(--line);color:#344a3b;padding:7px 13px;border-radius:8px}
.chip.rec{background:#eaf3ed;border-color:#c3dbc9;color:#1f5f35}
.chip.sel{background:var(--c);border-color:var(--c);color:#fff}
.time span{white-space:nowrap}
.bar{margin-top:6px}
.nav .btn{background:transparent;border-color:var(--line);color:var(--mute);font-weight:500}
details.card summary{color:var(--c);letter-spacing:1px}
.set input,.set select{background:#f1f5f2;border:1px solid transparent;border-radius:8px}
.set input[type=range],.set input[type=checkbox]{accent-color:var(--c)}
#out .hd .pri{background:var(--c3)}
.tip0{display:block;font-size:12.5px;color:var(--mute);background:#fff;border:1px dashed #c9d8cd;border-radius:10px;padding:7px 10px;margin-top:-2px;line-height:1.5}
</style>
<script>
window.__errs=[];
function __showErr(m){try{window.__errs.push(m);var d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='background:#c62828;color:#fff;font-size:13px;padding:10px 12px;margin:10px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-all';(document.body||document.documentElement).insertBefore(d,(document.body||document.documentElement).firstChild)}d.textContent='⚠ 錯誤（請截圖給 Claude）\n'+window.__errs.join('\n')+'\n'+navigator.userAgent}catch(e){}}
window.addEventListener('error',function(e){__showErr((e.message||'error')+' @'+(e.lineno||'?')+':'+(e.colno||'?'))});
window.addEventListener('unhandledrejection',function(e){var x=e.reason;__showErr('promise: '+(x&&x.message?x.message:x&&x.code?x.code:x&&x.type?('Event '+x.type+' '+((x.target&&(x.target.src||x.target.error&&x.target.error.message))||'').toString().slice(0,60)):String(x)))});
</script>
</head>
<body>
<div class="upd" id="upd"></div>
<header><div class="tpls" id="tpls"></div><div class="stripe"></div></header>
<main>
  <div class="step"><b>01</b>拍照・匯入</div>
  <div class="add">
    <label class="btn pri">📷 拍照<input id="cam" type="file" accept="image/*" capture="environment"></label>
    <label class="btn">🖼 相簿多選<input id="pick" type="file" accept="image/*" multiple></label>
  </div>
  <details class="iosGuide" id="iosGuide"><summary>📱 iPhone 使用方式（點此展開／收起）</summary>
    <ol><li>用 iPhone 內建「相機」拍，<b>廣角、長焦</b>都能用</li>
    <li>回到這裡按「<b>相簿多選</b>」匯入</li>
    <li>按「全部輸出」後，點綠色的「<b>存到照片</b>」→ 選「<b>儲存 N 張影像</b>」</li></ol>
    <small>直接按下載的圖會進「檔案」App，不會出現在照片裡。</small></details>
  <div class="tip0">📷 如遇到 App「拍照」<b>無法切換廣角／長焦</b>：請改用手機內建相機拍，拍完按「相簿多選」一次匯入</div>
  <div class="strip" id="strip"></div>
  <div class="prev" id="prev"><div class="empty">按「拍照」會開啟手機原相機<br>或用「相簿多選」一次匯入現場拍好的照片</div></div>
  <div class="warn" id="warn"></div>
  <div class="qbar" id="qbar"><button class="btn pri" id="qSave">💾 儲存這張</button><label class="btn" id="qSame">📸 同缺失再拍<input id="cam2" type="file" accept="image/*" capture="environment"></label></div>
  <button class="btn annoB" id="annoB" style="display:none">✏ 標註缺失（框選・箭頭・文字）</button>

async function exifDate(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);
    if(v.getUint16(0)!==0xFFD8)return null;let o=2;
    while(o<v.byteLength-4){
      const m=v.getUint16(o);if((m&0xFF00)!==0xFF00)return null;const len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949;const g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
        const readIFD=(p,tags)=>{const n=g16(t+p),r={};for(let i=0;i<n;i++){const e=t+p+2+i*12,tag=g16(e);if(tags.includes(tag))r[tag]=tag===0x8769?g32(e+8):str(t+g32(e+8),g32(e+4))}return r};

function drawAnno(x,W,H,list){
  const M=Math.max(W,H),m=Math.min(W,H);

    else if(a.t==='ellipse'){x.beginPath();x.ellipse((X1+X2)/2,(Y1+Y2)/2,Math.abs(X2-X1)/2||1,Math.abs(Y2-Y1)/2||1,0,0,Math.PI*2);x.stroke()}

  if(t.titleCenter){x.textAlign='center';x.fillText(title,(tx+X+bw-pd)/2,Y+headH/2+u*0.15);x.textAlign='left'}
  else x.fillText(title,tx,Y+headH/2+u*0.15);
  x.restore();
  // rows
  x.font=`${fs}px ${FONT}`;x.fillStyle='#1d1d1d';let yy=Y+headH+pd*0.7+lh/2;
  rows.forEach((r,i)=>{x.fillText(r[0]+'：',X+pd,yy);lines[i].forEach(l=>{x.fillText(l,X+pd+lw,yy);yy+=lh})});
}

async function deliver(files){
  const dl=await Promise.race([dlP,new Promise(r=>setTimeout(()=>r(null),1500))]);
  if(dl){try{
    if(files.length===1){await dl.save({filename:files[0].name,data:files[0].blob});return '已儲存'}
    await loadZip();const z=new JSZip();files.forEach(f=>z.file(f.name,f.blob));
    const zb=await z.generateAsync({type:'blob',compression:'STORE'});
    const t=new Date();await dl.save({filename:`${T().short}_水印_${t.getMonth()+1}${pad2(t.getDate())}_${files.length}張.zip`,data:zb});return '已儲存 ZIP';
  }catch(e){if(e&&e.code==='declined')throw e;await showOut(files);return null}}
  if(IOS){await showOut(files);return null}
  for(const f of files){try{const a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove()}catch(e){}await new Promise(r=>setTimeout(r,300))}
  if(files.length===1){snack('✓ 已下載 1 張','查看／修改',()=>showOut(files));return null}
  await showOut(files);
  return null;
}

function editFromOut(pid){const i=photos.findIndex(p=>p.id===pid);closeOut();if(i<0)return toast('這張已從清單移除');cur=i;saveCur();unlock(photos[i]);
  setTimeout(()=>{try{$('prev').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}},50);toast('已解鎖，改完再按「儲存這張」')}
$('outShare').onclick=()=>{const fl=OUT.map(f=>new File([f.blob],f.name,{type:f.blob.type||'image/jpeg'}));navigator.share({files:fl}).then(()=>toast('完成')).catch(e=>{if(e&&e.name!=='AbortError')toast('分享失敗，請改用長按圖片儲存')})};
function loadZip(){return window.JSZip?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function toTop(){try{document.querySelector('.add').scrollIntoView({behavior:'smooth',block:'center'})}catch(e){window.scrollTo(0,0)}}
let BUSY=false;
async function run(list){BUSY=true;try{await run2(list)}finally{BUSY=false}}
async function run2(list){
  mask(true,'產生中…');
  try{const out=[];for(let i=0;i<list.length;i++){mask(true,`產生中 ${i+1}/${list.length}`);out.push(await makeFile(list[i]))}
    if(IOS&&ST().keepOrig)list.forEach(p=>{if(p.fromCam){const d=p.time;out.push({name:`原圖_${T().short}_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.jpg`,blob:p.file,orig:true})}});
    mask(false);
    const P=photos[cur];if(P&&list.includes(P)){S.last[S.tpl]=Object.assign({},P.f);S.lastc[S.tpl]=clone(P.comp||{})||{};if(!pinned()){S.last[S.tpl].defect='';delete S.lastc[S.tpl].defect}save()}
    list.forEach(p=>{p.done=true;persist(p,true)});ORD={};drawAll();toTop();
    const msg=await deliver(out);if(msg)toast(msg)}
  catch(e){mask(false);toast(e&&e.code==='declined'?'已取消':'儲存失敗：'+(e&&(e.message||e.code)||e))}
  drawStrip();drawForm();
}
$('saveOne').onclick=()=>photos[cur]&&run([photos[cur]]);
$('saveAll').onclick=()=>photos.length&&run(photos.slice());

function mask(on,t){$('mask').classList.toggle('show',on);if(t)$('maskT').textContent=t}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2000)}

/* ---------- annotation editor ---------- */
const ED={tool:'rect',col:'#ff2a2a',z:1,list:[],base:null,cv:null,tmp:null,txtPos:null};
try{const pref=store.get('wm_anno_ys',null);if(pref)Object.assign(ED,{tool:pref.tool||'rect',col:pref.col||'#ff2a2a',z:pref.z||1})}catch(e){}
function edSync(){
  document.querySelectorAll('#edTools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===ED.tool));
  document.querySelectorAll('#edTools [data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===ED.col));
  document.querySelectorAll('#edTools [data-z]').forEach(b=>b.classList.toggle('on',+b.dataset.z===ED.z));
  store.set('wm_anno',{tool:ED.tool,col:ED.col,z:ED.z});
}
function edDraw(){
  const c=ED.cv,x=c.getContext('2d'),W=c.width,H=c.height;x.drawImage(ED.base,0,0);
  drawAnno(x,W,H,ED.tmp?ED.list.concat([ED.tmp]):ED.list);drawWM(x,W,H,photos[cur]);
  const a=ED.list[ED.sel];$('edD').disabled=!a;
  if(a){const [l,t,rr,b]=bbox(a,W,H),k=Math.max(W,H)*0.006;x.save();x.setLineDash([k*2,k*1.5]);x.lineWidth=k*0.5;x.strokeStyle='#fff';x.shadowColor='#000';x.shadowBlur=k;
    x.strokeRect(l-k*2,t-k*2,rr-l+k*4,b-t+k*4);x.restore();
    for(const h of handles(a,W,H)){x.beginPath();x.arc(h[2],h[3],k*2.6,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.lineWidth=k*0.7;x.strokeStyle='#1e90ff';x.stroke()}}
}
function bbox(a,W,H){
  if(a.t==='pen'){const xs=a.pts.map(q=>q[0]*W),ys=a.pts.map(q=>q[1]*H);return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
  if(a.t==='text'){const x=ED.cv.getContext('2d'),fs=Math.min(W,H)*0.048*(a.z||1);x.font=`700 ${fs}px ${FONT}`;const ls=String(a.s).split('\n');
    const w=Math.max(...ls.map(l=>x.measureText(l).width));return [a.x1*W,a.y1*H-fs/2,a.x1*W+w,a.y1*H-fs/2+ls.length*fs*1.25]}
  return [Math.min(a.x1,a.x2)*W,Math.min(a.y1,a.y2)*H,Math.max(a.x1,a.x2)*W,Math.max(a.y1,a.y2)*H];
}
function handles(a,W,H){
  const P=(kx,ky)=>[kx,ky,a[kx]*W,a[ky]*H];
  if(a.t==='rect'||a.t==='ellipse')return [P('x1','y1'),P('x2','y1'),P('x1','y2'),P('x2','y2')];
  if(a.t==='arrow')return [P('x1','y1'),P('x2','y2')];
  return [];
}
function hitTest(a,px,py,W,H){
  const tol=Math.max(W,H)*0.03;
  if(a.t==='arrow'){const x1=a.x1*W,y1=a.y1*H,x2=a.x2*W,y2=a.y2*H,dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy||1;
    let t=((px-x1)*dx+(py-y1)*dy)/L;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))<tol}
  const [l,t,rr,b]=bbox(a,W,H);return px>l-tol&&px<rr+tol&&py>t-tol&&py<b+tol;
}
$('annoB').onclick=async()=>{
  const p=photos[cur];if(!p)return;mask(true,'載入中…');
  ED.base=await render(p,1400,{base:true});ED.list=JSON.parse(JSON.stringify(p.anno||[]));ED.sel=-1;ED.editIdx=-1;
  const c=document.createElement('canvas');c.width=ED.base.width;c.height=ED.base.height;ED.cv=c;
  $('edCv').innerHTML='';$('edCv').appendChild(c);bindCv(c);edSync();edDraw();mask(false);pushLayer();$('ed').classList.add('show');
};
function pos(e){const r=ED.cv.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]}
function openText(idx,val){ED.editIdx=idx;$('tbar').classList.add('show');$('tIn').value=val||'';$('tOK').textContent=idx>=0?'更新':'加上';setTimeout(()=>$('tIn').focus(),50)}
function bindCv(c){
  let drag=null;
  c.onpointerdown=e=>{e.preventDefault();const [nx,ny]=pos(e),W=c.width,H=c.height,px=nx*W,py=ny*H;
    const cur=ED.list[ED.sel];
    if(cur){for(const h of handles(cur,W,H))if(Math.hypot(px-h[2],py-h[3])<Math.max(W,H)*0.045){drag={m:'h',kx:h[0],ky:h[1]};c.setPointerCapture(e.pointerId);return}}
    let hit=-1;for(let i=ED.list.length-1;i>=0;i--)if(hitTest(ED.list[i],px,py,W,H)){hit=i;break}
    if(hit>=0){const was=hit===ED.sel;ED.sel=hit;drag={m:'m',s:[nx,ny],o:JSON.parse(JSON.stringify(ED.list[hit])),was,moved:false};c.setPointerCapture(e.pointerId);edDraw();return}
    ED.sel=-1;
    if(ED.tool==='text'){ED.txtPos=[nx,ny];openText(-1,'');edDraw();return}
    drag={m:'d'};c.setPointerCapture(e.pointerId);
    ED.tmp=ED.tool==='pen'?{t:'pen',c:ED.col,z:ED.z,pts:[[nx,ny]]}:{t:ED.tool,c:ED.col,z:ED.z,x1:nx,y1:ny,x2:nx,y2:ny};edDraw()};
  c.onpointermove=e=>{if(!drag)return;const [nx,ny]=pos(e);
    if(drag.m==='h'){const a=ED.list[ED.sel];a[drag.kx]=nx;a[drag.ky]=ny}
    else if(drag.m==='m'){const a=ED.list[ED.sel],o=drag.o,dx=nx-drag.s[0],dy=ny-drag.s[1];if(Math.hypot(dx,dy)>0.006)drag.moved=true;
      if(a.t==='pen')a.pts=o.pts.map(q=>[q[0]+dx,q[1]+dy]);else{a.x1=o.x1+dx;a.y1=o.y1+dy;if('x2' in o){a.x2=o.x2+dx;a.y2=o.y2+dy}}}
    else if(ED.tmp){if(ED.tmp.t==='pen')ED.tmp.pts.push([nx,ny]);else{ED.tmp.x2=nx;ED.tmp.y2=ny}}
    edDraw()};
  const up=()=>{if(!drag)return;const d=drag;drag=null;
    if(d.m==='m'&&!d.moved&&d.was&&ED.list[ED.sel].t==='text'){openText(ED.sel,ED.list[ED.sel].s);return}
    if(d.m==='d'){const t=ED.tmp;ED.tmp=null;if(t){const tiny=t.t==='pen'?t.pts.length<2:Math.hypot(t.x2-t.x1,t.y2-t.y1)<0.01;if(!tiny){ED.list.push(t);ED.sel=ED.list.length-1}}}
    edDraw()};
  c.onpointerup=up;c.onpointercancel=up;
}
$('tOK').onclick=()=>{const v=$('tIn').value.trim();
  if(ED.editIdx>=0){if(v)ED.list[ED.editIdx].s=v;else{ED.list.splice(ED.editIdx,1);ED.sel=-1}}
  else if(v&&ED.txtPos){ED.list.push({t:'text',c:ED.col,z:ED.z,x1:ED.txtPos[0],y1:ED.txtPos[1],s:v});ED.sel=ED.list.length-1}
  ED.editIdx=-1;$('tbar').classList.remove('show');$('tIn').blur();edDraw()};
$('tIn').onkeydown=e=>{if(e.key==='Enter')$('tOK').click()};
$('tX').onclick=()=>{$('tbar').classList.remove('show');$('tIn').blur()};
document.querySelectorAll('#edTools [data-t]').forEach(b=>b.onclick=()=>{ED.tool=b.dataset.t;ED.sel=-1;edSync();edDraw();if(ED.tool==='text')toast('點圖片上要放文字的位置')});
document.querySelectorAll('#edTools [data-c]').forEach(b=>b.onclick=()=>{ED.col=b.dataset.c;edSync();const a=ED.list[ED.sel];if(a){a.c=ED.col;edDraw()}});
document.querySelectorAll('#edTools [data-z]').forEach(b=>b.onclick=()=>{ED.z=+b.dataset.z;edSync();const a=ED.list[ED.sel];if(a){a.z=ED.z;edDraw()}});
$('edU').onclick=()=>{ED.list.pop();ED.sel=-1;edDraw()};
$('edD').onclick=()=>{if(ED.sel>=0){ED.list.splice(ED.sel,1);ED.sel=-1;edDraw()}};
$('edC').onclick=()=>{ED.list=[];ED.sel=-1;edDraw()};
$('edX').onclick=()=>{$('ed').classList.remove('show');$('tbar').classList.remove('show');popLayer()};
$('edOK').onclick=()=>{const p=photos[cur];if(p){p.anno=ED.list;p.done=false;persist(p,true)}$('ed').classList.remove('show');$('tbar').classList.remove('show');popLayer();drawStrip();drawPrev()};

function verInit(){
  $('ver').textContent=`${document.title}  v${APP_VER}`;
  if(location.protocol!=='https:'||!/github\.io$/.test(location.hostname))return;
  fetch('./index.html',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/const APP_VER='([^']+)'/);if(m&&m[1]!==APP_VER){const u=$('upd');u.textContent=`🔄 有新版本 v${m[1]}，點這裡更新`;u.classList.add('show');
    u.onclick=async()=>{u.textContent='更新中…';try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}location.reload()}}}).catch(()=>{});
}
try{drawAll();restore();verInit()}catch(e){__showErr('init: '+e.message+'\n'+(e.stack||''))}
